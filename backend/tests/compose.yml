services:
  postgres:
    # pgvector image (superset of postgres:17): the knowledgebase migration needs the
    # `vector` extension, so the test/dev DB must provide it for `alembic upgrade head`.
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: pg_isready -U postgres
      interval: 5s
      timeout: 3s
      retries: 5
