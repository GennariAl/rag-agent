[project]
name = "okd"
version = "0.1.0"
description = "OKD API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ag-ui-langgraph>=0.0.42",
    "aioboto3>=15.0.0",
    "aiofiles>=24.1.0",
    "alembic>=1.16.5",
    "asyncpg>=0.30.0",
    "boto3>=1.35.0",
    "cryptography>=44.0.3",
    "dishka>=1.6.0",
    "fastapi[standard]>=0.115.12",
    "httpx>=0.28.0",
    "langchain-aws>=1.1.0",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.2",
    "langchain-postgres>=0.0.17",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.4,<2",
    "markdown-it-py>=3.0.0",
    "markdownify>=1.2.3",
    "openai>=2.38.0",
    "pandas>=2.2.0",
    "pgvector>=0.3.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.11.3",
    "pydantic-settings>=2.9.1",
    "pyjwt>=2.10.1",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "sqlalchemy>=2.0.43",
    "types-aioboto3[s3]>=15.0.0",
]

[dependency-groups]
dev = [
    "moto[server]>=5.1.12",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-mock>=3.14.1",
    "pytest-cov",
]

[tool.pytest.ini_options]
pythonpath = "./"
testpaths = "tests"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff.lint]
extend-select = ["I"]
